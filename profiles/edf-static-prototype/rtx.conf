# One validated static draw. The installed EDF executable must match its fingerprint.
rtx.enableRaytracing = True
rtx.edfStatic.enabled = True
rtx.edfStatic.rasterOnly = True
rtx.edfStatic.executable = "EDF-IA.exe"
rtx.edfStatic.executableSha1 = "d2e90641c560420d279a629ddd86e13cb767f464"

